name: "Pre-Flight Backend Bootstrap"

on:
  workflow_call:
  push:
    branches:
      - development
    paths:
      - 'environments/dev/**'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI if needed

jobs:
  bootstrap:
    name: "Verify & Provision Remote Backend"
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Securely authenticate with AWS using your Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: us-east-1

    # 3. Dynamic Bash Logic to verify and conditionally create the backend structures
    - name: Check and Create S3 State Bucket
      run: |
        BUCKET_NAME="handsonlab-tfstate-storage-dev"
        
        echo "Checking if S3 bucket '$BUCKET_NAME' exists..."
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "✅ S3 Bucket already exists. Skipping creation."
        else
          echo "⚠️ S3 Bucket not found. Initiating secure provisioning..."
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
          
          echo "Enabling bucket versioning rules..."
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
          echo "✅ S3 bucket built and secured successfully."
        fi

    - name: Check and Create DynamoDB Lock Table
      run: |
        TABLE_NAME="handsonlab-tflocks-dev"
        
        echo "Checking if DynamoDB table '$TABLE_NAME' exists..."
        if aws dynamodb describe-table --table-name "$TABLE_NAME" --region us-east-1 2>/dev/null; then
          echo "✅ DynamoDB lock table already exists. Skipping creation."
        else
          echo "⚠️ DynamoDB table not found. Building state locking engine..."
          if ! create_output=$(aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 \
              --region us-east-1 2>&1); then
            if [[ "$create_output" == *"ResourceInUseException"* ]]; then
              echo "✅ DynamoDB table creation is already in progress. Continuing to wait."
            else
              echo "$create_output" >&2
              exit 1
            fi
          fi

          echo "Waiting for table activation..."
          for attempt in {1..30}; do
            table_status=$(aws dynamodb describe-table \
              --table-name "$TABLE_NAME" \
              --region us-east-1 \
              --query 'Table.TableStatus' \
              --output text 2>/dev/null || true)

            if [ "$table_status" = "ACTIVE" ]; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "DynamoDB table did not become ACTIVE. Last status: $table_status" >&2
              exit 1
            fi

            sleep 10
          done
          echo "✅ DynamoDB lock table created and online."
        fi
