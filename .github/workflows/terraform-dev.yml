name: "Terraform Dev Deployment"

on:
  push:
    branches:
      - development
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      backend_origin_domain_name:
        description: "EKS ALB DNS name for the /api/* CloudFront origin"
        required: false
        type: string
  pull_request:
    branches:
      - development
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.github/workflows/**'

jobs:

  # 1. Trigger the bootstrap logic first
  bootstrap-backend:
    uses: ./.github/workflows/bootstrap-backend-dev.yml
    secrets: inherit

  terraform:
    name: "Terraform Automation"
    needs: bootstrap-backend # 👈 Forces dependency execution order
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
    # 1. Checkout your code from GitHub onto the pipeline server
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup the Terraform CLI tool
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.3

    # 3. Securely authenticate with AWS using your GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: us-east-1

    - name: Read EKS ALB hostname
      id: backend_origin
      if: github.event_name != 'workflow_dispatch' || inputs.backend_origin_domain_name == ''
      run: |
        set -euo pipefail
        ssm_error_file=$(mktemp)
        if backend_origin_domain_name=$(aws ssm get-parameter \
          --name "/handsonlab/dev/backend-origin-domain-name" \
          --query 'Parameter.Value' \
          --output text \
          --region us-east-1 2>"$ssm_error_file"); then
          :
        else
          ssm_status=$?
          cat "$ssm_error_file" >&2
          if grep -q "ParameterNotFound" "$ssm_error_file"; then
            echo "Backend ALB hostname is not available yet; continuing with the initial infrastructure bootstrap."
            backend_origin_domain_name=""
          else
            exit "$ssm_status"
          fi
        fi
        rm -f "$ssm_error_file"
        echo "backend_origin_domain_name=$backend_origin_domain_name" >> "$GITHUB_OUTPUT"

    # 4. Check for clean syntax formatting
    - name: Terraform Format Check
      run: terraform fmt -check

    # 5. Initialize plugins and backend state
    - name: Terraform Init
      run: terraform init

    - name: Adopt existing ECR repository
      run: |
        set -euo pipefail
        repository_address="module.container_registry.aws_ecr_repository.backend"
        if terraform state show "$repository_address" >/dev/null 2>&1; then
          echo "ECR repository is already managed by Terraform."
          exit 0
        fi

        if aws ecr describe-repositories \
          --repository-names "dev-backend-service" \
          --region us-east-1 >/dev/null 2>&1; then
          terraform import "$repository_address" "dev-backend-service"
        else
          echo "ECR repository does not exist yet; Terraform will create it."
        fi

    # 6. Show the proposed changes for every deployment event
    - name: Terraform Plan
      if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        BACKEND_ORIGIN_DOMAIN_NAME: ${{ inputs.backend_origin_domain_name || steps.backend_origin.outputs.backend_origin_domain_name }}
      run: |
        if [ -n "$BACKEND_ORIGIN_DOMAIN_NAME" ]; then
          terraform plan -no-color -var="backend_origin_domain_name=$BACKEND_ORIGIN_DOMAIN_NAME"
        else
          terraform plan -no-color
        fi

    # 7. Automatically deploy changes when code lands on the development branch
    - name: Terraform Apply
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/development')
      env:
        BACKEND_ORIGIN_DOMAIN_NAME: ${{ inputs.backend_origin_domain_name || steps.backend_origin.outputs.backend_origin_domain_name }}
      run: |
        if [ -n "$BACKEND_ORIGIN_DOMAIN_NAME" ]; then
          terraform apply -auto-approve -var="backend_origin_domain_name=$BACKEND_ORIGIN_DOMAIN_NAME"
        else
          echo "No EKS ALB hostname found. Applying core infrastructure without the CloudFront /api/* origin."
          terraform apply -auto-approve
        fi
